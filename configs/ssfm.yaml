ssfm:
  hidden: 128
  n_teachers: 3
  teachers: [mvo, max_sharpe, risk_parity]
  teacher_emb: 8
  steps: 120
  validation_interval: 20
  batch_size: 32
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  n_sample_steps: 12
  default_g_source: validation
  default_g: 32
  candidate_select: predicted_utility
  risk_aversion: 1.0
  clr_eps: 1.0e-8
  scheduler:
    type: cosine
    min_lr: 0.0

standard_fm:
  hidden: 128
  steps: 120
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  n_sample_steps: 12
  scheduler: {type: cosine, min_lr: 0.0}

diffusion:
  hidden: 128
  steps: 120
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  n_diff_steps: 40
  scheduler: {type: cosine, min_lr: 0.0}

mlp_policy:
  hidden: 128
  steps: 120
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  scheduler: {type: cosine, min_lr: 0.0}

gaussian_policy:
  hidden: 128
  steps: 120
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  nll_weight: 1.0
  min_std: 0.05
  max_std: 2.0
  scheduler: {type: cosine, min_lr: 0.0}
