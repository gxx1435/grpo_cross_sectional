prediction:
  strategy_name: minute_transformer_cross_stock_attention
  target: intraday_log_return
  formula: log(Close_D / Open_D)
  feat_dim: auto
  d_model: 48
  n_heads: 4
  ff_mult: 2
  n_layers_temporal: 2
  n_layers_cross: 1
  patch: 30
  dropout: 0.1
  stock_chunk: 96
  optimizer: AdamW
  lr: 0.0005
  weight_decay: 0.0001
  epochs: 2
  early_stopping_patience: 2
  grad_clip: 1.0
  batch_asofs: 1
  prediction_loss:
    type: huber
    delta: 1.0
  rank_weight: 0.0
  feat_standardize: true
  feat_std_stride: 5
  feat_std_bar_stride: 10
  feature_scaler:
    epsilon: 1.0e-6
    zmax: 5.0
  val_select: mse
  scheduler:
    type: cosine
    min_lr: 0.00001
  seeds: [42]
  models:
    - minute_transformer_cross_stock_attention
  primary_model: minute_transformer_cross_stock_attention
