experiment:
  name: sp500_minute_ssfm_strict_oos
  seed: 42
  deterministic: true
  deterministic_warn_only: true

paths:
  root: .
  source_zip: /home/zouli/projects/research/data/_temp/EQUS-20260919-6L9X397UJK.zip
  processed_dir: data/processed/sp500
  results_dir: results/S&P500

universe:
  index: S&P500
  type: data_available_equity_universe
  join_key: stock_code
  history_min_coverage: 0.70
  min_history_minutes: 780
  min_target_minutes: 300
  disclosure: >-
    Source metadata contains a fixed requested symbol list, not point-in-time
    historical S&P 500 membership. The daily universe is therefore an audited
    data-availability proxy and is exposed to survivorship and selection bias.

calendar:
  timezone: America/New_York
  bars_per_day: 390
  lookback_days: 10
  regular_session_start: "09:30"
  regular_session_end: "15:59"
  execution_clock: "09:30:00"
  realization_clock: "16:00:00"
  decision_clock: "09:29:59"

panel:
  start: auto
  end: auto

walkforward:
  test_start: "2025-06"
  test_end: auto
  train_months: 12
  val_months: 1
  train_offset_months: 13

oos_modes:
  - strict_fixed_oos

features:
  windows: [5, 10, 30, 60, 120, 240, 390, 780]
  vwap_pairs: [[5, 30], [5, 60], [10, 60], [30, 120]]
  base_return_windows: [5, 10, 30, 60, 120]
  base_volatility_windows: [5, 10, 30, 60, 120]
  relative_volume_windows: [5, 20]
  volume_weighted_return_volume_window: 5
  price_ma_windows: [5, 10, 20]
  ma_spread_pair: [5, 20]
  cross_sectional_rank_sources:
    cs_rank_return_30: return_30
    cs_rank_return_60: return_60
    cs_rank_relative_volume: relative_volume_20
    cs_rank_volatility: vol_30
  epsilon: 1.0e-8
  parquet_compression: zstd
  persist_dtype: float32
  raw_chunksize: 500000

portfolio:
  top_k: 30
  long_only: true
  max_weight: 0.15
  transaction_cost_rate: 0.0003
  initial_turnover_policy: from_cash
  return_type: log
  hist_risk_lookback_days: 60
  risk_model:
    covariance_epsilon: 1.0e-6
    mvo_risk_aversion: 1.0
    max_sharpe_grid_points: 40
    max_sharpe_lambda_min: 0.05
    max_sharpe_lambda_max: 20.0
    risk_parity_iterations: 200
    black_litterman_tau: 0.05
    black_litterman_view_variance_scale: 0.25
  sharpe_min_obs: 10
  sharpe_fallback: 0.0
  smooth_dd_temperature: 20.0

reward:
  w_return: 0.4
  w_sharpe: 0.4
  w_turnover: 0.15
  w_smooth_mdd: 0.15
  zmax: 5.0
  eps: 1.0e-8
  fit_on: train_only

runtime:
  train_day_stride: 5
  state_day_stride: 5
  validation_day_stride: 1
  num_data_workers: 0

gpu:
  mixed_precision: true
  gradient_checkpointing: false
  allow_grad_accum: true
  oom_max_retries: 4
  monitor_interval_sec: 10.0
  high_utilization: true
  target_util_pct: 80
  cudnn_benchmark: false
  allow_tf32: false
  progress_gpu_poll_sec: 30.0
