    delta: 1.0
  rank_weight: 0.0
  feat_standardize: true
  feat_std_stride: 5
  feat_std_bar_stride: 10
  feature_scaler:
    epsilon: 1.0e-06
    zmax: 5.0
  val_select: mse
  scheduler:
    type: cosine
    min_lr: 1.0e-05
  seeds:
  - 42
  models:
  - minute_transformer_cross_stock_attention
  primary_model: minute_transformer_cross_stock_attention
ssfm:
  hidden: 128
  n_teachers: 3
  teachers:
  - mvo
  - max_sharpe
  - risk_parity
  teacher_emb: 8
  steps: 120
  validation_interval: 20
  batch_size: 32
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  n_sample_steps: 12
