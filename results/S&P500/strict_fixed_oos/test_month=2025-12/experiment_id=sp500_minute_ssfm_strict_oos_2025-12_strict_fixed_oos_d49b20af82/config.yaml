runtime:
  train_day_stride: 5
  state_day_stride: 5
  validation_day_stride: 1
  num_data_workers: 0
gpu:
  mixed_precision: true
  gradient_checkpointing: false
  allow_grad_accum: true
  oom_max_retries: 4
  monitor_interval_sec: 10.0
  high_utilization: true
  target_util_pct: 80
  cudnn_benchmark: false
  allow_tf32: false
  progress_gpu_poll_sec: 30.0
prediction:
