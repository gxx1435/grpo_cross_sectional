  target: intraday_log_return
  formula: log(Close_D / Open_D)
  feat_dim: auto
  d_model: 48
  n_heads: 4
  ff_mult: 2
  n_layers_temporal: 2
  n_layers_cross: 1
  patch: 30
  dropout: 0.1
  stock_chunk: 96
  optimizer: AdamW
  lr: 0.0005
  weight_decay: 0.0001
  epochs: 2
  early_stopping_patience: 2
  grad_clip: 1.0
  batch_asofs: 1
  prediction_loss:
